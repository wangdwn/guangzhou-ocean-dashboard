// 颜色生成
function signalHtml(color, label, val) {
  const cls = `signal-${color||'gray'}`;
  const tc = color==='green'?'sig-label-green':color==='yellow'?'sig-label-yellow':color==='red'?'sig-label-red':'sig-label-gray';
  return `<div class="flex flex-col items-center"><div class="signal-dot ${cls}"></div><div class="text-xs mt-1 ${tc} font-medium">${label||'无数据'}</div>${val!==undefined?`<div class="text-xs" style="color:var(--faint)">${val}</div>`:''}</div>`;
}

// 模拟信号（演示模式）
function mockSignal() {
  const colors = ['green','green','green','green','yellow','yellow','red'];
  return colors[Math.floor(Math.random() * (Math.random()>0.7?7:4))];
}
function mockScore() { return Math.floor(50 + Math.random()*45); }

// 获取所有科
function allFamilies() {
  const fs = [];
  for (const p of TREE.phyla) {
    for (const c of p.classes||[]) {
      for (const o of c.orders||[]) {
        for (const f of o.families||[]) {
          fs.push({...f, phylumName: p.name, phylumIcon: p.icon||'', className: c.name, orderName: o.name});
        }
      }
    }
  }
  return fs;
}

const DIMS = ['fund_flow','logistics_flow','market_entity','industry_chain','env_risk','policy'];
const DIM_NAMES = ['💰 资金流','📦 物流流','🏢 主体流','🔗 产业链','🌡️ 环境流','📜 政策流'];

// ------ 总览页 ------
function renderOverview() {
  const el = document.getElementById('overview-content');
  const families = allFamilies();
  let html = '';
  for (const p of TREE.phyla) {
    html += `<div class="card mb-4"><h3 class="font-bold text-lg mb-2">${p.icon||''} ${p.name}</h3><p class="text-xs text-gray-500 mb-4">${p.description||''}</p>`;
    html += `<div class="overflow-x-auto"><table class="w-full text-xs"><thead><tr class="border-b bg-gray-50"><th class="p-2 text-left w-48">产业科</th>`;
    for (const dn of DIM_NAMES) html += `<th class="p-2 text-center">${dn}</th>`;
    html += `</tr></thead><tbody>`;

    for (const c of p.classes||[]) {
      for (const o of c.orders||[]) {
        for (const f of o.families||[]) {
          html += `<tr class="border-b hover:bg-gray-50"><td class="p-2 font-medium">${f.code}<br><span class="text-gray-600">${f.name}</span></td>`;
          for (const d of DIMS) {
            const sig = mockSignal();
            html += `<td class="p-2 text-center"><div class="signal-dot signal-${sig}" style="width:24px;height:24px;margin:0 auto"></div></td>`;
          }
          html += `</tr>`;
        }
      }
    }
    html += `</tbody></table></div></div>`;
  }
  el.innerHTML = html;
}

// ------ 产业诊断页 ------
function buildTreeNav() {
  const el = document.getElementById('tree-nav');
  let html = '';
  let idx = 0;
  for (const p of TREE.phyla) {
    html += `<div class="font-semibold mt-2 first:mt-0" style="color:var(--primary)">${p.icon||''} ${p.name}</div>`;
    for (const c of p.classes||[]) {
      for (const o of c.orders||[]) {
        for (const f of o.families||[]) {
          const code = f.code;
          html += `<div class="pl-4 py-1 cursor-pointer rounded" style="color:var(--fg-secondary)" onmouseover="this.style.color='var(--pan-c)';this.style.background='color-mix(in srgb, var(--pan-c) 10%, var(--card))'" onmouseout="this.style.color='var(--fg-secondary)';this.style.background='transparent'" onclick="showFamily('${code}')">${code} ${f.name}</div>`;
          idx++;
        }
      }
    }
  }
  el.innerHTML = html;
}

function showFamily(code) {
  const families = allFamilies();
  const f = families.find(x=>x.code===code);
  if (!f) return;
  const el = document.getElementById('family-detail');
  let signals = '';
  for (const d of DIMS) {
    const sig = mockSignal();
    const sval = mockScore();
    signals += `<div class="text-center p-3 rounded-lg" style="background:var(--bg-subtle)"><div class="text-xs" style="color:var(--muted)">${DIM_NAMES[DIMS.indexOf(d)]}</div>${signalHtml(sig, sig==='green'?'优良':sig==='yellow'?'一般':'预警', `${sval}`)}</div>`;
  }
  el.innerHTML = `
    <h3 class="text-lg font-bold mb-1" style="color:var(--fg)">${f.name}</h3>
    <p class="text-xs mb-1" style="color:var(--muted)">${f.code} · ${f.phylumName} > ${f.className} > ${f.orderName}</p>
    <p class="text-sm mb-4" style="color:var(--fg-secondary)">${f.description||''}</p>
    <div class="grid grid-cols-6 gap-3 mb-6">${signals}</div>
    <h4 class="font-semibold mb-2">🏢 代表性企业</h4>
    <div class="grid grid-cols-2 md:grid-cols-3 gap-2">${(f.enterprises||[]).map(e=>'<div class="p-2 ent-chip rounded text-sm"><div class="font-medium">'+e.name+'</div><div class="text-xs" style="color:var(--muted)">'+e.type+'</div></div>').join('')||'<div class="text-sm" style="color:var(--faint)">暂无企业数据</div>'}</div>
  `;
}

// ------ 交叉矩阵页 ------
function renderMatrix() {
  const el = document.getElementById('matrix-content');
  const families = allFamilies();
  let html = `<div class="card"><h3 class="font-semibold mb-4">🔀 综合交叉验证热力图</h3><div class="overflow-x-auto"><table class="w-full text-xs"><thead><tr class="border-b bg-gray-50"><th class="p-2 text-left min-w-[160px]">产业科</th>`;
  for (const dn of DIM_NAMES) html += `<th class="p-2 text-center">${dn}</th>`;
  html += `</tr></thead><tbody>`;

  for (const p of TREE.phyla) {
    let count = 0;
    let rowHtml = '';
    for (const c of p.classes||[]) {
      for (const o of c.orders||[]) {
        for (const f of o.families||[]) {
          count++;
          const sigs = DIMS.map(() => mockScore());
          const avg = Math.round(sigs.reduce((a,b)=>a+b,0)/sigs.length);
          const sigColor = avg>=70?'green':avg>=50?'yellow':'red';
          rowHtml += `<tr class="border-b hover:bg-gray-50"><td class="p-2 font-medium"><div>${f.code}</div><div class="text-gray-500">${f.name}</div></td>`;
          rowHtml += sigs.map(s=>{
            const sc = s>=70?'bg-green-400':s>=50?'bg-yellow-400':'bg-red-400';
            const tc = s>=70?'text-green-800':s>=50?'text-yellow-800':'text-red-800';
            return `<td class="p-2 text-center"><span class="inline-block w-8 h-8 rounded-lg ${sc} ${tc} flex items-center justify-center text-xs font-bold">${s}</span></td>`;
          }).join('');
          rowHtml += `<td class="p-2 text-center"><div class="signal-dot signal-${sigColor}" style="width:28px;height:28px;margin:0 auto"></div></td>`;
          rowHtml += `</tr>`;
        }
      }
    }
    if (count > 0) {
      html += `<tr class="phylum-row"><td class="p-2 font-bold" colspan="8">${p.icon||''} ${p.name}（${count}个产业科）</td></tr>`;
      html += rowHtml;
    }
  }
  html += '</tbody></table></div></div>';

  // 统计卡片
  const allScores = DIMS.map(()=>mockScore());
  const avg = Math.round(allScores.reduce((a,b)=>a+b,0)/allScores.length);
  html += `<div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-6">
    <div class="card text-center"><div class="text-2xl font-bold stat-success">${avg}%</div><div class="text-xs" style="color:var(--muted)">综合活跃度</div></div>
    <div class="card text-center"><div class="text-2xl font-bold stat-primary">${families.length}</div><div class="text-xs" style="color:var(--muted)">产业科总数</div></div>
    <div class="card text-center"><div class="text-2xl font-bold stat-success">${Math.round(families.length*0.65)}</div><div class="text-xs" style="color:var(--muted)">绿灯产业</div></div>
    <div class="card text-center"><div class="text-2xl font-bold stat-danger">${Math.round(families.length*0.05)}</div><div class="text-xs" style="color:var(--muted)">红灯产业</div></div>
  </div>`;
  el.innerHTML = html;
}

// ------ 页面切换 ------
function showPage(name) {
  ['overview','diagnosis','matrix'].forEach(p => {
    document.getElementById('page-'+p).classList.add('hidden');
    const btn = document.getElementById('tab-'+p);
    if (btn) btn.classList.remove('is-on');
  });
  document.getElementById('page-'+name).classList.remove('hidden');
  const btn = document.getElementById('tab-'+name);
  if (btn) btn.classList.add('is-on');
}

// ------ 初始化 ------
renderOverview();
buildTreeNav();
renderMatrix();
if (allFamilies().length > 0) showFamily(allFamilies()[0].code);
</script>
